prSections:
  - title: "Direct Review"
    filters: "is:open user-review-requested:@me sort:updated-desc"
    limit: 25
    notify: true
  - title: "Team Review"
    filters: "is:open review-requested:@me -user-review-requested:@me sort:updated-desc"
    limit: 25
    notify: true
    layout:
      requestedTeams:
        hidden: false
        width: 12
  - title: "My PRs"
    filters: "is:open author:@me sort:updated-desc"
    limit: 30
  - title: "Reviewed by me"
    filters: "is:open reviewed-by:@me sort:updated-desc"
    limit: 20

issuesSections: []

# Alternatively, drive notifications from GitHub's notification queue instead of
# (or in addition to) prSections above. Uncomment and add notify: true to the
# sections you want alerts from.
# notificationsSections:
#   - title: "Review Requested"
#     filters: "reason:review-requested"
#     notify: true
#   - title: "Participating"
#     filters: "reason:participating"

defaults:
  view: prs
  prsLimit: 25
  refetchIntervalMinutes: 5
  preview:
    open: true
    width: 60
  layout:
    prs:
      requestedTeams:
        hidden: true   # override per-section above; shown in Team Review only

# Smart filtering hides PRs you've already reviewed from review sections.
# Disabled here so the AI summary tab remains useful for already-reviewed PRs.
smartFilteringAtLaunch: false
showAuthorIcons: true

ai:
  enabled: true
  model: claude-haiku-4-5-20251001   # optional — this is the default
