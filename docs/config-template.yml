prSections:
  - title: "Direct Review"
    filters: "is:open user-review-requested:@me sort:updated-desc"
    limit: 25
  - title: "Team Review"
    filters: "is:open review-requested:@me -user-review-requested:@me sort:updated-desc"
    limit: 25
    layout:
      requestedTeams:   # shows the requested-teams column for this section
        hidden: false
        width: 12
  - title: "My PRs"
    filters: "is:open author:@me sort:updated-desc"
    limit: 30
  - title: "Reviewed by me"
    filters: "is:open reviewed-by:@me sort:updated-desc"
    limit: 20

issuesSections: []

# Desktop notifications fire from notificationsSections with notify: true.
# Only review_requested (direct ask) and team_mention (CODEOWNERS) trigger alerts.
# All other reasons (comment, state_change, assign, etc.) are excluded by the dispatcher.
notificationsSections:
  - title: "Review Requested"
    filters: "reason:review-requested"
    notify: true
  - title: "Participating"
    filters: "reason:participating"

defaults:
  view: prs
  prsLimit: 25
  refetchIntervalMinutes: 5
  preview:
    open: true
    width: 60
  layout:
    prs:
      requestedTeams:
        hidden: true   # shown per-section above in Team Review only

# Smart filtering hides PRs you've already reviewed from review sections.
# Disabled here so the AI summary tab remains useful for already-reviewed PRs.
smartFilteringAtLaunch: false
showAuthorIcons: true

ai:
  enabled: true
  model: claude-haiku-4-5-20251001   # optional — see Anthropic docs for valid model IDs
